# Ultralytics YOLOv8n with Resolution-aware Feature Enhancement v3
# RFE-v3 uses an identity-safe residual design:
# output = original P3 feature + gamma * enhancement
# gamma is initialized to zero inside the RFEv3 module.

# Parameters
nc: 10

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4-P3/8 backbone feature
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9-P5/32

# YOLOv8.0n head with identity-safe RFE-v3
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15-P3/8 head feature

  - [[15, 4], 1, RFEv3, [256]]                  # 16-P3/8 identity-safe enhanced feature

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 12], 1, Concat, [1]]                  # 18 cat head P4
  - [-1, 3, C2f, [512]]                         # 19-P4/16 medium feature

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 9], 1, Concat, [1]]                   # 21 cat head P5
  - [-1, 3, C2f, [1024]]                        # 22-P5/32 large feature

  - [[16, 19, 22], 1, Detect, [nc]]             # 23 Detect(P3-RFE-v3, P4, P5)
